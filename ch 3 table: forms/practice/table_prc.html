<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cricket score</title>
    <style>
    body {
        font-family: Arial, sans-serif;
        background: #0f172a;
        color: white;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        margin: 0;
    }

    table {
        width: 80%;
        max-width: 900px;
        border-collapse: collapse;
        background: #1e293b;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    th {
        background: #16a34a;
        color: white;
        padding: 16px;
        text-align: center;
        font-size: 16px;
        text-transform: uppercase;
    }

    td {
        padding: 15px;
        text-align: center;
        border-bottom: 1px solid #334155;
        font-size: 15px;
    }

    td:first-child {
        text-align: left;
        font-weight: bold;
        text-transform: capitalize;
    }

    tbody tr:hover {
        background: #334155;
    }

    tbody tr:last-child td {
        background: #0f766e;
        color: white;
        font-size: 18px;
        font-weight: bold;
        text-align: center;
        border: none;
    }

    td:nth-child(2) {
        font-weight: bold;
        color: #facc15;
        font-size: 17px;
    }

    @media (max-width: 700px) {
        table {
            width: 95%;
        }

        th,
        td {
            padding: 10px 6px;
            font-size: 12px;
        }

        td:nth-child(2) {
            font-size: 14px;
        }
    }
</style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th>cricketer name</th>
                <th>score</th>
                <th>balls</th>
                <th>fours</th>
                <th>sixes</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>virat kohli</td>
                <td>103</td>
                <td>54</td>
                <td>5</td>
                <td>10</td>

            </tr>
            <tr>
                <td>shubman gill</td>
                <td>204</td>
                <td>154</td>
                <td>13</td>
                <td>20</td>

            </tr>
            <tr>
                <td>rohit sharma</td>
                <td>103</td>
                <td>54</td>
                <td>5</td>
                <td>10</td>

            </tr>
            <tr>
                <td>ms dhoni</td>
                <td>103</td>
                <td>54</td>
                <td>5</td>
                <td>10</td>

            </tr>
            <tr>
                <td colspan="4"> TOTAL SCORE = 516</td>
            </tr>

        </tbody>
    </table>
</body>
</html>
