<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tables</title>
    <!-- css is use by ai  -->
    <style>
    table {
        width: 100%;
        border-collapse: collapse;
        margin: 20px 0;
        font-family: Arial, sans-serif;
        background: #1e1e1e;
        color: #ffffff;
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    th {
        background: #2d2d2d;
        color: #00bfff;
        padding: 14px 18px;
        text-align: left;
        font-size: 15px;
        font-weight: 600;
        border-bottom: 2px solid #00bfff;
    }

    td {
        padding: 13px 18px;
        border-bottom: 1px solid #3a3a3a;
        font-size: 14px;
    }

    tr {
        transition: 0.2s ease;
    }

    tr:hover {
        background: #292929;
    }

    tr:last-child td {
        border-bottom: none;
    }
</style>
</head>
<body>
    <h1>TABLES IN HTML</h1>
    <table>
        <thead>
            <tr>
                <th>NAME</th>
                <th>ROLE</th>
                <th>SALARY</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>amaan</td>
                <td>software developer</td>
                <td> 20 lakh</td>
            </tr>
            <tr>
                <td>areeb</td>
                <td>backend developer</td>
                <td>18 lakh</td>
            </tr>
            <tr>
                <td>soban</td>
                <td>fronted developer</td>
                <td>21 lakh</td>
            </tr>
            <tr>
                <td colspan="3">thanks</td>
            </tr>
        </tbody>
        </table>
</body>
</html>
