<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>list</title>
</head>

<body>
    <h1>list in html</h1>
    <h2>UNORDERED LIST</h2>
    <ul>
        <li>Home</li>
        <li>body</li>
    </ul>
    <h2>ORDERED LIST</h2>
    <OL>
        <li>home</li>
        <li>body</li>
    </OL>
    <h2>Defination list</h2>
    <dl>
        <dt>python</dt>
        <dd> easy syntax language</dd>
        <dt>c language</dt>
        <dd>mother of all language</dd>
    </dl>

</html>
